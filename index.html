<!DOCTYPE html>
<html lang="gl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxecto Trasnoca - Mapa Dialectolóxico</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Fonte Merriweather -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-brown: #2c221e;
      --glass-bg: rgba(44, 34, 30, 0.90);
      --glass-border: rgba(212, 175, 55, 0.3);
      --accent-gold: #d4af37;
      --accent-gold-hover: #f3e5ab;
      --text-light: #f5f2eb;
      --text-muted: #c8bfae;
      --font-main: 'Merriweather', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: var(--font-main);
      background-color: var(--bg-brown);
      color: var(--text-light);
      overflow: hidden;
    }

    /* Mapa a pantalla completa */
    #map {
      height: 100vh;
      width: 100vw;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Botón hamburguesa */
    .menu-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1000;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--accent-gold);
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-family: var(--font-main);
      font-weight: 700;
      font-size: 1rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .menu-toggle:hover {
      background: var(--accent-gold);
      color: var(--bg-brown);
    }

    /* Menú lateral (Sidebar) */
    .sidebar {
      position: absolute;
      top: 0;
      right: -420px;
      width: 400px;
      height: 100vh;
      background: var(--glass-bg);
      border-left: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      z-index: 999;
      padding: 30px 25px;
      overflow-y: auto;
      transition: right 0.4s ease-in-out;
      box-shadow: -5px 0 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
    }

    .sidebar.open {
      right: 0;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--glass-border);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .sidebar h2 {
      color: var(--accent-gold);
      font-size: 1.4rem;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .close-btn:hover {
      color: var(--accent-gold);
    }

    .sidebar p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    /* Botón principal para abrir o cuestionario */
    .btn-start-survey {
      background: var(--accent-gold);
      color: var(--bg-brown);
      border: none;
      padding: 14px 20px;
      border-radius: 8px;
      font-family: var(--font-main);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      width: 100%;
      text-align: center;
      transition: background 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      margin-top: 10px;
    }

    .btn-start-survey:hover {
      background: var(--accent-gold-hover);
    }

    .btn-back {
      background: transparent;
      color: var(--accent-gold);
      border: 1px solid var(--glass-border);
      padding: 8px 12px;
      border-radius: 6px;
      font-family: var(--font-main);
      font-size: 0.8rem;
      cursor: pointer;
      margin-bottom: 15px;
      align-self: flex-start;
    }

    /* Contedor do Formulario (Oculto por defecto) */
    #surveyContainer {
      display: none;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .filter-group label {
      font-size: 0.85rem;
      color: var(--text-light);
    }

    .filter-group input,
    .filter-group select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.4);
      color: var(--text-light);
      font-family: var(--font-main);
      font-size: 0.85rem;
      outline: none;
    }

    .filter-group input:focus,
    .filter-group select:focus {
      border-color: var(--accent-gold);
    }

    /* Mascota (Pandeireta) e bocadillo de texto */
    .mascot-container {
      position: absolute;
      bottom: 25px;
      left: 25px;
      z-index: 1000;
      display: flex;
      align-items: flex-end;
      gap: 15px;
      pointer-events: none;
    }

    .mascot-img {
      width: 80px;
      height: 80px;
      background: var(--accent-gold);
      border-radius: 50%;
      border: 3px solid var(--bg-brown);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      pointer-events: auto;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .mascot-img:hover {
      transform: scale(1.08);
    }

    .speech-bubble {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-light);
      padding: 12px 16px;
      border-radius: 12px 12px 12px 0;
      font-size: 0.85rem;
      max-width: 250px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      pointer-events: auto;
    }

    .speech-bubble.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 600px) {
      .sidebar {
        width: 100%;
        right: -100%;
      }
      .speech-bubble {
        max-width: 180px;
      }
    }
  </style>
</head>
<body>

  <!-- Mapa Leaflet -->
  <div id="map"></div>

  <!-- Botón hamburguesa -->
  <button class="menu-toggle" onclick="toggleMenu()">
    <span>☰</span> Menú
  </button>

  <!-- Menú lateral -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>Proxecto Trasnoca</h2>
      <button class="close-btn" onclick="toggleMenu()">✕</button>
    </div>

    <!-- Vista inicial do menú -->
    <div id="mainMenuView">
      <p>Benvida ao mapa de variación dialectolóxica de Galicia. Explora os puntos e axúdanos a recoller o patrimonio lingüístico vivo da túa zona.</p>
      
      <button class="btn-start-survey" onclick="mostrarCuestionario()">
        📝 Achegar variante lingüística
      </button>
    </div>

    <!-- Vista do Formulario (Oculta ao inicio) -->
    <div id="surveyContainer">
      <button class="btn-back" onclick="ocultarCuestionario()">← Volver ao menú</button>
      
      <form id="trasnocaSurveyForm" class="contact-form">
        <div class="filter-group">
          <label for="surveyCategory">Categoría / Tema:</label>
          <select id="surveyCategory" required>
            <option value="Xeral">Xeral</option>
            <option value="Aves">Aves e animais</option>
            <option value="Flora">Flora e vexetación</option>
            <option value="Construcions">Construcións tradicionais</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="surveyXenero">Xénero:</label>
          <select id="surveyXenero" required>
            <option value="">-- Selecciona --</option>
            <option value="Muller">Muller</option>
            <option value="Home">Home</option>
            <option value="Non binario">Non binario</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="surveyIdade">Rango de idade:</label>
          <select id="surveyIdade" required>
            <option value="">-- Selecciona --</option>
            <option value="Menor de 18">Menor de 18</option>
            <option value="18-29">18-29</option>
            <option value="30-49">30-49</option>
            <option value="50-65">50-65</option>
            <option value="Maior de 65">Maior de 65</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="surveyConcello">Concello:</label>
          <input type="text" id="surveyConcello" placeholder="Ex: Carballo" required>
        </div>

        <div class="filter-group">
          <label for="surveyParroquia">Parroquia (opcional):</label>
          <input type="text" id="surveyParroquia" placeholder="Ex: Sofán">
        </div>

        <div class="filter-group">
          <label for="surveyLocalidade">Localidade / Lugar:</label>
          <input type="text" id="surveyLocalidade" placeholder="Ex: Alvedro" required>
        </div>

        <div class="filter-group">
          <label for="surveyVariable">Variable preguntada:</label>
          <input type="text" id="surveyVariable" placeholder="Ex: Hórreo, Miñoca..." required>
        </div>

        <div class="filter-group">
          <label for="surveyVariante">Como se di na túa zona? (Variante):</label>
          <input type="text" id="surveyVariante" placeholder="Escribe a palabra exacta" required>
        </div>

        <button type="button" class="btn-start-survey" onclick="enviarEnquisaAnonima()">Enviar resposta anónima</button>
      </form>
    </div>
  </div>

  <!-- Mascota (Pandeireta) -->
  <div class="mascot-container">
    <div class="mascot-img" onclick="mascotClick()">🥁</div>
    <div class="speech-bubble" id="mascotSpeech">Ola! Preme no menú para achegar as túas palabras.</div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // -------------------------------------------------------------
    // CONFIGURACIÓN DE APPS SCRIPT (SUBSTITÚE ESTE ENLACE)
    // -------------------------------------------------------------
    const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbwEAIu_rFjP9n_S9fWHcbUouteHycqMhU50CZZzj1rlVSMBReVqAyG-GnrzwticUQ1a/exec';

    // Inicialización do mapa centrado en Galicia
    const map = L.map('map').setView([42.5751, -8.1339], 8);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Control do menú lateral
    function toggleMenu() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('open');
      if (!sidebar.classList.contains('open')) {
        ocultarCuestionario();
      }
    }

    function mostrarCuestionario() {
      document.getElementById('mainMenuView').style.display = 'none';
      document.getElementById('surveyContainer').style.display = 'block';
    }

    function ocultarCuestionario() {
      document.getElementById('mainMenuView').style.display = 'block';
      document.getElementById('surveyContainer').style.display = 'none';
    }

    // Interaccións coa Mascota
    let mascotTimeout;
    function speakAssistant(text, autoHide = true, delay = 5000) {
      const bubble = document.getElementById('mascotSpeech');
      bubble.textContent = text;
      bubble.classList.add('visible');

      clearTimeout(mascotTimeout);
      if (autoHide) {
        mascotTimeout = setTimeout(() => {
          bubble.classList.remove('visible');
        }, delay);
      }
    }

    function mascotClick() {
      speakAssistant("Preme no menú superior para abrir o formulario e enviar novas variantes!", true, 6000);
    }

    setTimeout(() => {
      speakAssistant("Benvida a Trasnoca! Explora o mapa ou abre o menú para colaborar.", true, 6000);
    }, 2000);

    // Envío do Formulario a Google Apps Script
    function enviarEnquisaAnonima() {
      const payload = {
        categoria: document.getElementById('surveyCategory').value,
        xenero: document.getElementById('surveyXenero').value,
        idade: document.getElementById('surveyIdade').value,
        concello: document.getElementById('surveyConcello').value,
        parroquia: document.getElementById('surveyParroquia').value,
        localidade: document.getElementById('surveyLocalidade').value,
        variable: document.getElementById('surveyVariable').value,
        variante_ob: document.getElementById('surveyVariante').value
      };

      if (!payload.concello || !payload.localidade || !payload.variante_ob) {
        alert('Por favor, cobre polo menos o Concello, a Localidade e a Variante.');
        return;
      }

      if (URL_APPS_SCRIPT.includes('PEGA_AQUÍ')) {
        alert('Lembrete: Debes colar a URL xerada por Apps Script no ficheiro index.html.');
        return;
      }

      fetch(URL_APPS_SCRIPT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        speakAssistant("Moitas grazas! A túa achega anónima gardouse correctamente na pestana Pendentes.", false, 6000);
        document.getElementById('trasnocaSurveyForm').reset();
        ocultarCuestionario();
        toggleMenu();
      })
      .catch(err => {
        alert('Houbo un erro ao enviar os datos. Inténtao de novo!');
      });
    }
  </script>
</body>
</html>
