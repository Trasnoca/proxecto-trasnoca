<!DOCTYPE html>
<html lang="gl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxecto Trasnoca</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    header { background-color: #2c3e50; color: white; padding: 12px 20px; text-align: center; }
    #map { height: calc(100vh - 55px); width: 100vw; }
  </style>
</head>
<body>
  <header>
    <h1 style="margin:0; font-size: 1.4rem;">Proxecto Trasnoca</h1>
  </header>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([42.8782, -7.8644], 8);

    // Esri World Street Map (A color, clásico e sen API Key)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri'
    }).addTo(map);
  </script>
</body>
</html>
