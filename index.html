<!DOCTYPE html>
<html lang="gl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxecto Trasnoca</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    header { background-color: #2c3e50; color: white; padding: 12px 20px; text-align: center; }
    #map { height: calc(100vh - 55px); width: 100vw; }
    .popup-title { font-weight: bold; font-size: 1.1rem; color: #2c3e50; margin-bottom: 4px; }
    .popup-detail { font-size: 0.9rem; color: #555; margin: 2px 0; }
  </style>
</head>
<body>

  <header>
    <h1 style="margin:0; font-size: 1.4rem;">Proxecto Trasnoca</h1>
  </header>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    const hotLayer = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    });

    const esriNatGeo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/NatGeo_World_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 16,
      attribution: 'Tiles &copy; Esri'
    });

    const map = L.map('map', {
      center: [42.8782, -7.8644],
      zoom: 8,
      layers: [hotLayer]
    });

    L.control.layers({
      "Pastel cálido (Humanitario)": hotLayer,
      "Estilo NatGeo": esriNatGeo
    }).addTo(map);

    // PEGA AQUÍ A TÚA LIGAZÓN CSV (SÓ NESA LIÑA):
    const URL_CSV = 'https://docs.google.com/spreadsheets/d/1C6sUUmKd1YCgIoyV1UgVD0CkLfNMZE_Fl_T9Ue4gaio/export?format=csv';

    if (URL_CSV && URL_CSV !== 'PEGA_AQUI_A_TUA_LIGAZON_CSV') {
      Papa.parse(URL_CSV, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          results.data.forEach(row => {
            const lat = parseFloat(row['Latitude']);
            const lng = parseFloat(row['Lonxitude']);

            if (!isNaN(lat) && !isNaN(lng)) {
              const popupContent = `
                <div class="popup-title">${row['Variante ob'] || 'Sen variante'}</div>
                <div class="popup-detail"><strong>Variable:</strong> ${row['Variable'] || '-'}</div>
                <div class="popup-detail"><strong>Lugar:</strong> ${row['Localidade'] || ''} (${row['Parroquia'] || ''}), ${row['Concello'] || ''}</div>
                <hr style="margin: 6px 0; border: 0; border-top: 1px solid #eee;">
                <div class="popup-detail"><strong>Informante:</strong> ${row['ID do Informante'] || '-'} (${row['Xénero'] || '-'}, ${row['Idade'] || '-'} anos)</div>
              `;

              L.marker([lat, lng])
                .addTo(map)
                .bindPopup(popupContent);
            }
          });
        }
      });
    }
  </script>

</body>
</html>
